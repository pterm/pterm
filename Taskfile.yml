version: 3

tasks:
  lint:
    cmds:
      - golangci-lint run

  fmt:
    cmds:
      - golangci-lint run --fix

  test:
    desc: Run tests with race detection
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -race ./...

  animations:
    desc: Record every example with VHS and regenerate the example docs
    cmds:
      - scripts/animate.sh

  animations:dry:
    desc: Record every example without touching the docs
    cmds:
      - scripts/animate.sh --dry-run

  animations:measure:
    desc: Measure the examples and print the generated VHS tapes (no Docker needed)
    cmds:
      - scripts/animate.sh --measure-only

  animate:
    desc: Record one example, e.g. task animate -- table/demo
    cmds:
      - scripts/animate.sh --example "{{.CLI_ARGS}}"

  examples:build:
    desc: Build and vet every example
    cmds:
      - scripts/build-examples.sh

  unittestcount:
    desc: Update the README unit test count badge
    cmds:
      - scripts/update-unittestcount.sh